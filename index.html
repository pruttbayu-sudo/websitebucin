<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Untuk Kamu 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      font-family: Arial, sans-serif;

      background: linear-gradient(
        135deg,
        #ffd6e7,
        #fff,
        #ffc2d8
      );

      color: #7a2948;
    }

    .card {
      width: 100%;
      max-width: 500px;

      padding: 35px 25px;

      text-align: center;

      background: rgba(255,255,255,0.9);

      border-radius: 25px;

      box-shadow:
        0 10px 30px rgba(180,70,110,0.2);
    }

    .heart {
      font-size: 55px;
    }

    h1 {
      color: #d6336c;
      font-size: 32px;
    }

    #pesan {
      min-height: 120px;

      line-height: 1.7;

      font-size: 16px;

      margin: 25px 0;
    }

    button {
      border: none;

      padding: 13px 25px;

      border-radius: 30px;

      font-size: 16px;

      font-weight: bold;

      margin: 5px;

      cursor: pointer;
    }

    #mau {
      background: #d6336c;
      color: white;
    }

    #enggak {
      background: white;
      color: #d6336c;
      border: 2px solid #ff9fbd;
    }

    #musik {
      background: #ffe1eb;
      color: #d6336c;
      margin-top: 20px;
    }

    #popup {
      display: none;

      position: fixed;

      inset: 0;

      background: rgba(0,0,0,0.5);

      justify-content: center;

      align-items: center;

      padding: 20px;
    }

    .popup-box {
      background: white;

      padding: 30px;

      border-radius: 25px;

      text-align: center;

      max-width: 400px;
    }

    .popup-box h2 {
      color: #d6336c;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="heart">
      💗
    </div>

    <h1>
      SPESIAL BUAT MIRA
    </h1>

    <p>
      Ada sesuatu yang mau aku sampaikan...
    </p>

    <div id="pesan"></div>

    <button id="mau">
      Mau 💕
    </button>

    <button id="enggak">
      Enggak 😜
    </button>

    <br>

    <button id="musik">
      🎵 Putar Musik
    </button>

  </div>


  <!-- POPUP -->

  <div id="popup">

    <div class="popup-box">

      <h2>
        Yeay! 💖
      </h2>

      <p>
        Makasih udah memilih "Mau" 🥰
        <br><br>
        terimakasih ya sayanggg suda mauuu
        menerimaaa kekurangann bayuu
        miraaa adalah seseorang yang
        sangatt sangatt spesiall. 💗
      </p>

      <button onclick="tutupPopup()">
        Tutup
      </button>

    </div>

  </div>


  <!-- MUSIK -->

  <audio id="audio" loop>
    <source src="7662107916178148112.mp3" type="audio/mpeg">
  </audio>


  <script>

    /* TYPING EFFECT */

    const teks =
      "Aku mungkin nggak selalu pandai " +
      "menghargaimu, tapi aku ingin " +
      "kamu tahu kalau kehadiranmu sangat berarti. " +
      "Terima kasihh telahh hadirr dan mewarnai hidupku " +
      "lovee youu miraaa. 💗";

    let posisi = 0;

    function mengetik() {

      if (posisi < teks.length) {

        document.getElementById("pesan").textContent =
          teks.substring(0, posisi + 1);

        posisi++;

        setTimeout(mengetik, 40);
      }
    }

    mengetik();


    /* TOMBOL MAU */

    document.getElementById("mau").onclick =
      function() {

        document.getElementById("popup").style.display =
          "flex";

      };


    /* TOMBOL ENGGAK */

    document.getElementById("enggak").onclick =
      function() {

        alert("Eits! Jangan pilih ini 😜💗");

      };


    /* TUTUP POPUP */

    function tutupPopup() {

      document.getElementById("popup").style.display =
        "none";

    }


    /* MUSIK */

    let sedangMain = false;

    document.getElementById("musik").onclick =
      function() {

        const audio =
          document.getElementById("audio");

        if (sedangMain) {

          audio.pause();

          this.textContent =
            "🎵 Putar Musik";

          sedangMain = false;

        } else {

          audio.play();

          this.textContent =
            "⏸️ Matikan Musik";

          sedangMain = true;

        }

      };

  </script>

</body>
</html>
